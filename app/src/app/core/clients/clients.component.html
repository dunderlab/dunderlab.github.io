<app-container id="clients">
  <div class="container-clients container-10">


    <h1 [innerHTML]="alliances.title.es" class="margin-bottom-extra-large"></h1>
    <div class="grid-projects grid-responsive-3 grid-center">
      @for (alliance of alliances.alliances; track alliance) {
      <div class="alliance" [class.invert]="themeService.mode() === 'dark'" [style.background-image]="'url(' + alliance + ')'">
      </div>
      }
    </div>
     <p [innerHTML]="alliances.about.es" class="align-center margin-top-large"></p>


  </div>
</app-container>
