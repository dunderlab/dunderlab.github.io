<app-container id="skills">
<div class="container-skills container-10">

  <div class="grid-skills grid-responsive-3">
    @for (skill of skills; track $index) {
      <mat-card class="example-card" appearance="outlined">
        <mat-card-header>
          <div mat-card-avatar>
            <mat-icon class="icon">{{ skill.icon }}</mat-icon>
          </div>
          <mat-card-title>{{ skill.title.es }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <p>
            {{ skill.description.es }}
          </p>
        </mat-card-content>

      </mat-card>
    }
  </div>

</div>
</app-container>
