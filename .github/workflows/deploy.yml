name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Set this to your default branch
    paths-ignore:
      - 'docs/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.NGBASE_DEPLOY_KEY }}" > ~/.ssh/ng_base_key

          chmod 600 ~/.ssh/ng_base_key

          cat <<EOF > ~/.ssh/config

          Host github-ngbase
            HostName github.com
            User git
            IdentityFile ~/.ssh/ng_base_key
            IdentitiesOnly yes
          EOF

          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Build
        working-directory: ./app
        run: npm run build -- --configuration production --base-href "/"

      - name: Create CNAME file
        run: mkdir -p ./docs/browser && echo "www.dunderlab.com" > ./docs/browser/CNAME && mv ./docs/browser/* ./docs/

      - name: Deploy files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add -A ./docs
          git commit -m "Deploy from CI: ${{ github.sha }} [skip ci]"
          git push origin main
